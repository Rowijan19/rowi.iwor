<!DOCTYPE html>
<html lang="ceb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffe45e;
    --ink: #1b1b3a;
    --accent: #ff4f7b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1b1b3a; --ink: #ffe45e; --accent: #ff6b9a; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1b1b3a; --ink: #ffe45e; --accent: #ff6b9a; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  }
  #go {
    font: 700 clamp(2rem, 9vw, 3.5rem)/1 "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    border-radius: 999px;
    padding: 0.5em 1.1em;
    cursor: pointer;
  }
  #go:focus-visible, .stage:focus-visible { outline: 4px solid var(--ink); outline-offset: 8px; }

  .stage { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .stage[hidden] { display: none; }
  .hi {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; gap: 0.04em;
    margin: 0; font-weight: 700; line-height: 1;
    font-size: clamp(7rem, 38vw, 26rem);
  }
  .hi span { display: inline-block; }
  .l { animation: drop 0.9s cubic-bezier(.3,.7,.4,1) both, float 2.4s ease-in-out infinite alternate; }
  .l:nth-child(1) { color: var(--ink); animation-delay: 0s, 0.9s; }
  .l:nth-child(2) { color: var(--accent); animation-delay: 0.18s, 1.2s; }
  .wave {
    font-size: 0.4em; transform-origin: 70% 80%;
    animation: pop 0.4s 0.95s cubic-bezier(.3,1.6,.5,1) both, wave 1.4s 1.4s ease-in-out infinite;
  }
  .dot {
    position: absolute; z-index: 0; left: 50%; top: 50%;
    width: 2.2vmin; height: 2.2vmin; border-radius: 50%;
    background: var(--ink); opacity: 0;
    animation: burst 1.1s 0.85s ease-out both;
  }
  .dot:nth-child(odd) { background: var(--accent); }

  @keyframes drop {
    0%   { transform: translateY(-110vh) rotate(-18deg); }
    55%  { transform: translateY(0) scale(1.15, 0.8); }
    72%  { transform: translateY(-9%) scale(0.96, 1.06); }
    88%  { transform: translateY(0) scale(1.03, 0.97); }
    100% { transform: none; }
  }
  @keyframes float { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4%) rotate(2deg); } }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0); }
    10% { transform: rotate(16deg); } 20% { transform: rotate(-10deg); }
    30% { transform: rotate(16deg); } 40% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); }
  }
  @keyframes burst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.3); }
  }
  @media (prefers-reduced-motion: reduce) {
    .l, .wave, .dot { animation: none; }
    .dot { display: none; }
  }
</style>
</head>
<body>
  <button id="go" type="button">Click me</button>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="HI. I-click para i-replay." hidden>
    <h1 class="hi" aria-hidden="true"><span class="l">H</span><span class="l">I</span><span class="wave">&#128075;</span></h1>
  </div>

  <script>
    var stage = document.getElementById("stage");
    for (var i = 0; i < 16; i++) {
      var a = (i / 16) * Math.PI * 2, d = 28 + Math.random() * 18, s = document.createElement("i");
      s.className = "dot";
      s.style.setProperty("--x", Math.cos(a) * d + "vmin");
      s.style.setProperty("--y", Math.sin(a) * d + "vmin");
      stage.insertBefore(s, stage.firstChild);
    }
    function play() { stage.hidden = true; void stage.offsetWidth; stage.hidden = false; }
    document.getElementById("go").addEventListener("click", function () { this.hidden = true; play(); });
    stage.addEventListener("click", play);
    stage.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
  </script>
</body>
</html>
